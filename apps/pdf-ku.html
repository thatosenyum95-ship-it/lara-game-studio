document.getElementById("download").onclick=async()=>{const b=document.getElementById("download"),n=document.getElementById("notice");b.disabled=true;b.textContent="⬇️ Menyiapkan download...";try{await laraTrackDownload(ID).catch(()=>{});const res=await fetch("https://atswttlqjycruzxuohfw.supabase.co/functions/v1/store-api?download="+ID,{cache:"no-store"});if(!res.ok)throw new Error("download");const blob=await res.blob();const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="PDF-ku.apk";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);n.textContent="✓ Download dimulai dari distribusi resmi Lara Studio."}catch(e){n.textContent="Download gagal. Silakan coba lagi.";n.className="error"}finally{b.disabled=false;b.textContent="⬇️ Download APK"}};load();
