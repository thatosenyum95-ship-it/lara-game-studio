<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Lara Studio — Aplikasi</title><style>:root{--bg:#07101d;--card:#0d1828;--line:#1d3047;--text:#f7fbff;--muted:#9fb0c4;--blue:#2563eb;--violet:#4f46e5;--good:#22c55e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#091321);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px 12px 36px}.back{color:#b9d7ff;font-weight:700}.card{margin-top:12px;background:#0d1828;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 50px #0005}.head{display:flex;gap:15px;align-items:center}.icon{width:96px;height:96px;min-width:96px;border-radius:22px;overflow:hidden;background:#16263b;display:grid;place-items:center;font-size:40px}.icon img{width:100%;height:100%;object-fit:cover}.title h1{margin:0;font-size:28px;line-height:1.1}.muted{color:var(--muted)}.badge{display:inline-block;margin-top:7px;padding:5px 10px;border-radius:999px;background:#123a29;color:#8ff0b0;font-size:12px;font-weight:800}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#c5d2e2}.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet));color:white;font-weight:850;font-size:16px}.section h2{font-size:20px}.feature{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.shot{width:180px;aspect-ratio:9/16;object-fit:cover;border-radius:16px;border:1px solid var(--line);margin-right:8px}.gallery{overflow:auto;white-space:nowrap}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{padding:10px;border:1px solid var(--line);border-radius:13px}.info span{display:block;color:var(--muted);font-size:12px}.hash{word-break:break-all;font:11px monospace}@media(max-width:480px){.info{grid-template-columns:1fr}.icon{width:82px;height:82px;min-width:82px}.title h1{font-size:24px}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← Kembali ke Lara Studio</a><section class="card"><div class="head"><div class="icon" id="icon">📱</div><div class="title"><h1 id="name">Memuat...</h1><div id="short" class="muted"></div><span id="badge" class="badge" style="display:none">✓ Official & Terverifikasi</span></div></div><div id="pills" class="pills"></div><button id="download" class="btn">⬇️ Download APK</button><div id="msg" class="muted" style="text-align:center;margin-top:9px"></div></section><section class="card"><h2>✨ Fitur</h2><div id="features" class="muted">Memuat...</div></section><section class="card"><h2>📸 Screenshot</h2><div id="gallery" class="gallery muted">Memuat...</div></section><section class="card"><h2>📋 Informasi APK</h2><div id="info" class="info"></div></section><section class="card"><h2>📝 Deskripsi</h2><div id="desc" class="muted"></div></section></main><script>const API='https://atswttlqjycruzxuohfw.supabase.co/rest/v1/',KEY='sb_publishable_oggTNyIqnoaMtUhk-2PxUQ_9V_CHTWj';const slug=new URLSearchParams(location.search).get('app');const H={apikey:KEY,Authorization:'Bearer '+KEY};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(p){const r=await fetch(API+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error('api');return r.json()}async function load(){if(!slug)throw Error('missing');const a=(await get('store_apps?page_slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&select=*&limit=1'))[0];if(!a)throw Error('notfound');const r=(await get('app_releases?app_id=eq.'+encodeURIComponent(a.id)+'&is_current=eq.true&select=*&limit=1'))[0]||{};document.title=(a.name||'Aplikasi')+' — Lara Studio';document.getElementById('name').textContent=a.name;document.getElementById('short').textContent=a.short_description||'';document.getElementById('desc').textContent=a.description||'Deskripsi belum tersedia.';if(a.icon_url)document.getElementById('icon').innerHTML='<img src="'+esc(a.icon_url)+'" alt="'+esc(a.name)+'">';if(a.official||a.verified)document.getElementById('badge').style.display='inline-block';document.getElementById('pills').innerHTML='<span class="pill">📦 '+esc(r.version||a.version||'—')+'</span><span class="pill">🤖 '+esc(r.min_android||a.android||'—')+'</span><span class="pill">🏷️ '+esc(a.category||'Aplikasi')+'</span>';const f=await get('app_features?app_id=eq.'+a.id+'&select=*&order=sort_order.asc');document.getElementById('features').innerHTML=f.length?f.map(x=>'<div class="feature"><b>✓ '+esc(x.title)+'</b>'+(x.description?'<div class="muted">'+esc(x.description)+'</div>':'')+'</div>').join(''):'Belum ada fitur.';const m=await get('app_media?app_id=eq.'+a.id+'&kind=eq.screenshot&select=*&order=sort_order.asc');const base='https://atswttlqjycruzxuohfw.supabase.co/storage/v1/object/public/lara-app-media/';document.getElementById('gallery').innerHTML=m.length?m.map(x=>'<img class="shot" src="'+base+encodeURI(x.storage_path)+'" alt="'+esc(x.alt_text||a.name)+'">').join(''):'Screenshot belum tersedia.';document.getElementById('info').innerHTML=[['Versi',r.version||a.version],['Ukuran',a.size||((r.apk_size_bytes/1024/1024).toFixed(2)+' MB')],['Android',r.min_android||a.android],['Developer',a.developer],['Kategori',a.category],['SHA-256',r.sha256||a.sha256]].map(x=>'<div><span>'+esc(x[0])+'</span><b class="'+(x[0]==='SHA-256'?'hash':'')+'">'+esc(x[1]||'—')+'</b></div>').join('');document.getElementById('download').onclick=()=>{location.href='/api/download/'+encodeURIComponent(slug)}}load().catch(()=>{document.getElementById('name').textContent='Aplikasi tidak ditemukan';document.getElementById('msg').textContent='Aplikasi belum dipublikasikan atau slug tidak valid.'});</script></body></html>
