name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest MultiTools APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p apps/multitools
          RUN_ID=$(gh api "repos/thatosenyum95-ship-it/MultiTools/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$RUN_ID"

          ARTIFACT_ID=$(gh api "repos/thatosenyum95-ship-it/MultiTools/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="MultiTools-debug") | .id' | head -n1)
          test -n "$ARTIFACT_ID"

          gh api --method GET "repos/thatosenyum95-ship-it/MultiTools/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/multitools.zip
          rm -rf /tmp/multitools
          mkdir -p /tmp/multitools
          unzip -o /tmp/multitools.zip -d /tmp/multitools

          APK=$(find /tmp/multitools -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" apps/multitools/MultiTools-Creative.apk

          test -f apps/multitools/MultiTools-Creative.apk
          SIZE=$(stat -c%s apps/multitools/MultiTools-Creative.apk)
          test "$SIZE" -gt 1000000
          SHA256=$(sha256sum apps/multitools/MultiTools-Creative.apk | cut -d" " -f1)
          echo "Published APK size: $SIZE bytes"
          echo "Published APK SHA-256: $SHA256"
          file apps/multitools/MultiTools-Creative.apk | grep -Ei 'Android|Zip archive|Java archive'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
