name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest MultiTools APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p apps/multitools
          RUN_ID=$(gh api "repos/thatosenyum95-ship-it/MultiTools/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$RUN_ID"
          ARTIFACT_ID=$(gh api "repos/thatosenyum95-ship-it/MultiTools/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="MultiTools-debug") | .id' | head -n1)
          test -n "$ARTIFACT_ID"
          gh api --method GET "repos/thatosenyum95-ship-it/MultiTools/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/multitools.zip
          unzip -o /tmp/multitools.zip -d apps/multitools
          test -f apps/multitools/app-debug.apk
          mv apps/multitools/app-debug.apk apps/multitools/MultiTools.apk
          test -s apps/multitools/MultiTools.apk
          file apps/multitools/MultiTools.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
