name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest MultiTools APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p apps/multitools
          # Pin the store to the audited original MultiTools APK.
          RUN_ID=37661580610
          ARTIFACT_ID=11501655996

          gh api --method GET "repos/thatosenyum95-ship-it/MultiTools/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/multitools.zip
          rm -rf /tmp/multitools
          mkdir -p /tmp/multitools
          unzip -o /tmp/multitools.zip -d /tmp/multitools

          APK=$(find /tmp/multitools -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" apps/multitools/MultiTools-Creative.apk

          test -f apps/multitools/MultiTools-Creative.apk
          SIZE=$(stat -c%s apps/multitools/MultiTools-Creative.apk)
          test "$SIZE" -eq 16403746
          echo "c1b04b3dfb508bd69d5dbf2e38e89396beabb14962ca3f7e5ad364d456511677  apps/multitools/MultiTools-Creative.apk" | sha256sum -c -
          file apps/multitools/MultiTools-Creative.apk | grep -Ei 'Android|Zip archive|Java archive'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
